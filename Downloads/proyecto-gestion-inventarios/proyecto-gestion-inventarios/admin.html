<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Administración - Inventario</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-gray-100 min-h-screen p-6">
  <div id="appHeader"></div>
  <div class="max-w-6xl mx-auto space-y-6">
    <div class="grid gap-6 xl:grid-cols-[1.1fr_1fr]">
      <section class="bg-white rounded-xl shadow p-6">
        <h2 id="formTitulo" class="text-lg font-semibold text-gray-800 mb-4">Agregar producto</h2>
        <form id="formProducto" class="space-y-4">
          <input id="prodId" type="hidden">
          <div class="grid gap-4 sm:grid-cols-2">
            <div>
              <label for="prodNombre" class="block text-sm font-medium text-gray-700">Nombre</label>
              <input id="prodNombre" type="text" class="mt-1 block w-full rounded-lg border border-gray-300 px-3 py-2" required>
            </div>
            <div>
              <label for="prodCategoria" class="block text-sm font-medium text-gray-700">Categoría</label>
              <select id="prodCategoria" class="mt-1 block w-full rounded-lg border border-gray-300 px-3 py-2" required></select>
            </div>
          </div>

          <div class="grid gap-4 sm:grid-cols-3">
            <div>
              <label for="prodStock" class="block text-sm font-medium text-gray-700">Stock</label>
              <input id="prodStock" type="number" min="0" class="mt-1 block w-full rounded-lg border border-gray-300 px-3 py-2" required>
            </div>
            <div>
              <label for="prodStockMin" class="block text-sm font-medium text-gray-700">Stock mínimo</label>
              <input id="prodStockMin" type="number" min="0" class="mt-1 block w-full rounded-lg border border-gray-300 px-3 py-2" required>
            </div>
            <div>
              <label for="prodPrecio" class="block text-sm font-medium text-gray-700">Precio</label>
              <input id="prodPrecio" type="number" min="0" step="0.01" class="mt-1 block w-full rounded-lg border border-gray-300 px-3 py-2" required>
            </div>
          </div>

          <div class="flex flex-wrap gap-3">
            <button id="submitProducto" type="submit" class="inline-flex items-center justify-center rounded-lg bg-blue-600 px-4 py-2 text-sm font-semibold text-white hover:bg-blue-700">Agregar producto</button>
            <button id="btnCancelarEdicion" type="button" class="inline-flex items-center justify-center rounded-lg bg-gray-200 px-4 py-2 text-sm font-semibold text-gray-700 hover:bg-gray-300 hidden">Cancelar edición</button>
          </div>
        </form>
      </section>

      <section class="bg-white rounded-xl shadow p-6">
        <h2 class="text-lg font-semibold text-gray-800 mb-4">Categorías</h2>
        <div class="mb-4 flex flex-col gap-3 sm:flex-row sm:items-center">
          <input id="categoriaNombre" type="text" placeholder="Nueva categoría" class="w-full rounded-lg border border-gray-300 px-3 py-2" />
          <button id="btnAgregarCategoria" class="inline-flex items-center justify-center rounded-lg bg-blue-600 px-4 py-2 text-sm font-semibold text-white hover:bg-blue-700">Agregar</button>
        </div>
        <ul id="listaCategorias" class="space-y-2 text-sm text-slate-700"></ul>
      </section>

      <section class="bg-white rounded-xl shadow p-6 overflow-x-auto">
        <h2 class="text-lg font-semibold text-gray-800 mb-4">Lista de productos</h2>
        <table class="min-w-full text-sm text-left">
          <thead class="border-b bg-gray-50 text-gray-500 uppercase text-xs">
            <tr>
              <th class="px-4 py-3">Nombre</th>
              <th class="px-4 py-3">Categoría</th>
              <th class="px-4 py-3">Stock</th>
              <th class="px-4 py-3">Stock mínimo</th>
              <th class="px-4 py-3">Precio</th>
              <th class="px-4 py-3">Acciones</th>
            </tr>
          </thead>
          <tbody id="tablaProductosAdmin" class="divide-y"></tbody>
        </table>
      </section>
    </div>
  </div>

  <script src="js/config/constants.js"></script>
  <script src="js/models/Producto.js"></script>
  <script src="js/models/Movimiento.js"></script>
  <script src="js/models/Usuario.js"></script>
  <script src="js/data/initData.js"></script>
  <script src="js/services/storageCache.js"></script>
  <script src="js/auth/auth.js"></script>
  <script src="js/services/productoService.js"></script>
  <script src="js/services/movimientoService.js"></script>
  <script src="js/services/uiPermisos.js"></script>
  <script src="js/utils/ui.js"></script>
  <script>
    initData();
    protegerRuta();
    renderAppHeader('Administración');
    if (getRol() !== ROLES.ADMIN) {
      window.location.href = 'dashboard.html';
    }
  </script>
  <script src="js/app-admin.js"></script>
</body>
</html>
